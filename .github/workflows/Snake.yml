name: Generate Snake

on:
  # Run automatically every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  
  # Allows you to manually run the job at any time from the Actions tab
  workflow_dispatch:
  
  # Also runs whenever you push a change to the main branch
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # 1. Check out your repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Generates the snake game animations using your settings
      - name: Generate GitHub Contribution Grid Snake
        uses: Platane/snk@v3.5.0
        with:
          github_user_name: SaberPawsNEW
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=purple

      # 3. Pushes the files in the 'dist' folder to a clean 'output' branch
      - name: Push Snake SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
